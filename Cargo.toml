[package]
name = "hdt-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "src/host/lib.rs"

[[bin]]
name = "hdt-host"
path = "src/host/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.30", features = ["fs", "process", "signal", "user", "sched", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }
x11rb = { version = "0.13", features = ["composite", "render", "xinput", "shape", "randr"] }
quick-xml = "0.42"
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bench]]
name = "input_protocol"
harness = false

[[test]]
name = "rust-config"
path = "tests/host/rust-config.rs"

[[test]]
name = "rust-diagnostics"
path = "tests/host/rust-diagnostics.rs"

[[test]]
name = "rust-launcher"
path = "tests/host/rust-launcher.rs"

[[test]]
name = "rust-x11-isolated"
path = "tests/host/rust-x11-isolated.rs"

[[test]]
name = "rust-x11"
path = "tests/host/rust-x11.rs"

[[test]]
name = "rust-client"
path = "tests/host/rust-client.rs"

[[test]]
name = "rust-snapshot"
path = "tests/host/rust-snapshot.rs"
