name: Nix checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          docs_only=$(bash scripts/ci-scope.sh "$BASE_SHA" "$HEAD_SHA")
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  source-quality:
    needs: scope
    if: ${{ needs.scope.outputs.docs-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore pinned development dependencies
        id: dependencies
        run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - name: Check TypeScript formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bun run format:ts:check
      - name: Lint TypeScript with Ultracite and anti-slop
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bun run lint:ts
      - name: Check TypeScript types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bun run typecheck
      - name: Analyze portable Framework code
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bun scripts/quality.ts check csharp-core
      - name: Evaluate analyzer sentinels
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bash scripts/evaluate.sh sentinels
      - name: Test screen-pixel classifier and negative controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: nix develop --command bash tests/replay/visual-triplet-checks.sh

  rust-quality:
    needs: scope
    if: ${{ needs.scope.outputs.docs-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Fetch locked Rust dependencies
        run: nix develop --command cargo fetch --locked
      - name: Check native Rust host
        run: nix develop --command bun scripts/quality.ts check rust
      - name: Bounded coverage-guided fuzz smoke
        run: nix develop --command bash scripts/check-fuzz.sh
      - name: Compile and smoke-test parser benchmarks
        run: nix develop --command bash scripts/bench-host.sh --test

  nix-check:
    needs: scope
    if: ${{ needs.scope.outputs.docs-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build package and run checks
        run: nix flake check --print-build-logs --no-write-lock-file --max-jobs 1 --cores 2

  check:
    if: ${{ always() }}
    needs: [scope, source-quality, rust-quality, nix-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all complete check jobs
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs-only }}
          SOURCE_QUALITY: ${{ needs.source-quality.result }}
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          NIX_CHECK: ${{ needs.nix-check.result }}
        run: |
          test "$SCOPE" = success
          if test "$DOCS_ONLY" = true; then
            test "$SOURCE_QUALITY" = skipped && test "$RUST_QUALITY" = skipped && test "$NIX_CHECK" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$SOURCE_QUALITY" = success && test "$RUST_QUALITY" = success && test "$NIX_CHECK" = success
          fi
