name: Android overlay

on:
  push:
    branches: [main, feat/avalonia-ui]
  pull_request:
    branches: [main, feat/avalonia-ui]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release-packaged: ${{ steps.sign-release.outputs.packaged }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: avalonia/global.json
      - name: Select JDK 21 and enable KVM on this runner
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Install Android SDK and screenshot OCR tools
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/hdt-android-sdk}"
          tools="$sdk/cmdline-tools/latest/bin"
          if [[ ! -x "$tools/sdkmanager" ]]; then
            mkdir -p "$sdk/cmdline-tools"
            curl -fsSL --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip' \
              -o "$RUNNER_TEMP/hdt-android-tools.zip"
            unzip -q "$RUNNER_TEMP/hdt-android-tools.zip" -d "$RUNNER_TEMP/hdt-android-tools"
            mv "$RUNNER_TEMP/hdt-android-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          "$tools/sdkmanager" --sdk_root="$sdk" --licenses < <(yes) >/dev/null
          "$tools/sdkmanager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'emulator' 'system-images;android-36;google_apis;x86_64'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$tools" "$sdk/platform-tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y imagemagick tesseract-ocr
      - name: Restore locked Android projects
        working-directory: avalonia
        run: |
          dotnet workload restore Hdt.Android/Hdt.Android.csproj --skip-manifest-update
          dotnet restore Hdt.Android/Hdt.Android.csproj --locked-mode
          dotnet restore Hdt.Android.Fixture/Hdt.Android.Fixture.csproj --locked-mode
      - name: Build emulator tracker and draft fixture
        working-directory: avalonia
        run: |
          dotnet build Hdt.Android/Hdt.Android.csproj --no-restore -t:SignAndroidPackage \
            -r android-x64 -p:HdtAndroidFixture=true
          dotnet build Hdt.Android.Fixture/Hdt.Android.Fixture.csproj --no-restore -t:SignAndroidPackage
      - name: Exercise the real Android capture and overlay
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/android-evidence"
          mkdir -p "$evidence"
          sdk="${ANDROID_HOME:?}"
          avd=hdt-ci-api36
          serial=emulator-5554
          export ANDROID_AVD_HOME="$RUNNER_TEMP/hdt-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdk/emulator/emulator" -accel-check
          printf 'no\n' | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --name "$avd" \
            --path "$ANDROID_AVD_HOME/$avd.avd" --package 'system-images;android-36;google_apis;x86_64'
          "$sdk/emulator/emulator" -list-avds | grep -Fx "$avd"
          sed -i -e 's/^hw.lcd.width=.*/hw.lcd.width=1080/' \
            -e 's/^hw.lcd.height=.*/hw.lcd.height=2160/' \
            -e 's/^hw.lcd.density=.*/hw.lcd.density=360/' "$ANDROID_AVD_HOME/$avd.avd/config.ini"
          adb start-server
          "$sdk/emulator/emulator" -avd "$avd" -port 5554 -accel on -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 3072 \
            > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          finish() {
            status=$?
            if [[ $status != 0 ]]; then tail -40 "$evidence/emulator.log"; fi
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap finish EXIT
          for attempt in $(seq 1 120); do
            kill -0 "$emulator_pid"
            boot=$(timeout 2 adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot" == 1 ]]; then break; fi
            sleep 2
          done
          test "$boot" = 1
          python3 scripts/check-android-overlay.py --serial "$serial" --evidence "$evidence" \
            avalonia/Hdt.Android/bin/Debug/net10.0-android36.0/android-x64/org.phibkro.hdt.android.fixture-Signed.apk \
            avalonia/Hdt.Android.Fixture/bin/Debug/net10.0-android36.0/android-x64/org.phibkro.hdt.testarena-Signed.apk
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-overlay-diagnostics
          path: ${{ runner.temp }}/android-evidence/
          if-no-files-found: ignore
      - name: Build and verify ARM64 device preview
        working-directory: avalonia
        run: |
          dotnet build Hdt.Android/Hdt.Android.csproj --no-restore -t:SignAndroidPackage -r android-arm64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            Hdt.Android/bin/Debug/net10.0-android36.0/android-arm64/org.phibkro.hdt.android-Signed.apk
      - name: Upload ARM64 preview after regression checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hdt-android-arm64-preview
          path: avalonia/Hdt.Android/bin/Debug/net10.0-android36.0/android-arm64/org.phibkro.hdt.android-Signed.apk
          if-no-files-found: error
      - name: Check whether the preview signing key is configured
        id: release-key
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/avalonia-ui' || github.ref == 'refs/heads/main')
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" && -z "$KEY_PASSWORD" ]]; then
            echo '::notice::Obtainium publication is waiting for the Android signing secrets.'
          elif [[ -z "$KEYSTORE" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Configure both Android signing secrets together.'
            exit 1
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release ARM64 APK
        if: steps.release-key.outputs.configured == 'true'
        working-directory: avalonia
        run: |
          dotnet build Hdt.Android/Hdt.Android.csproj --no-restore -c Release -t:PackageForAndroid \
            -r android-arm64 -p:PublishTrimmed=false -p:RunAOTCompilation=false -p:ApplicationVersion="$((GITHUB_RUN_NUMBER + 1))" \
            -p:ApplicationDisplayVersion="android-v0.1.$GITHUB_RUN_NUMBER"
      - name: Sign and verify the Obtainium APK
        id: sign-release
        if: steps.release-key.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          temporary=$(mktemp -d)
          trap 'rm -rf -- "$temporary"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$temporary/signing.p12"
          unset KEYSTORE
          tools="$ANDROID_HOME/build-tools/36.0.0"
          output="$RUNNER_TEMP/obtainium"
          mkdir -p "$output"
          unsigned=avalonia/Hdt.Android/bin/Release/net10.0-android36.0/android-arm64/org.phibkro.hdt.android.apk
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$temporary/aligned.apk"
          "$tools/apksigner" sign --ks "$temporary/signing.p12" --ks-key-alias hdt-android \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$output/hdt-android-arm64.apk" "$temporary/aligned.apk"
          unset KEY_PASSWORD
          signer() {
            "$tools/apksigner" verify --print-certs "$1" |
              awk '/^Signer #1 certificate SHA-256 digest: / { print $NF }'
          }
          digest=$(signer "$output/hdt-android-arm64.apk")
          test -n "$digest"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select((.isDraft | not) and (.tagName | startswith("android-v")))] | .[0].tagName // empty')
          if [[ -n "$previous" ]]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
              --pattern hdt-android-arm64.apk --output "$temporary/previous.apk"
            if [[ "$digest" != "$(signer "$temporary/previous.apk")" ]]; then
              echo '::error::The APK signer differs from the previous Android preview.'
              exit 1
            fi
          fi
          echo 'packaged=true' >> "$GITHUB_OUTPUT"
      - name: Upload the release-signed APK for publishing
        if: steps.sign-release.outputs.packaged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obtainium-apk
          path: ${{ runner.temp }}/obtainium/hdt-android-arm64.apk
          if-no-files-found: error

  publish-obtainium-preview:
    needs: android-overlay
    if: needs.android-overlay.outputs.release-packaged == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: android-preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: obtainium-apk
      - name: Publish the APK as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-v0.1.$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern hdt-android-arm64.apk --output "$RUNNER_TEMP/existing.apk"
            cmp hdt-android-arm64.apk "$RUNNER_TEMP/existing.apk"
          else
            gh release create "$tag" hdt-android-arm64.apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --title "Android preview 0.1.$GITHUB_RUN_NUMBER" \
              --notes 'ARM64 test preview. Includes Arena and match demos and live English Arena offer OCR.'
          fi
