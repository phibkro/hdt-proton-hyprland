minimum_pre_commit_version: "4.0.0"
repos:
  - repo: local
    hooks:
      - id: hdt-fast-source-checks
        name: Fast source checks (staged content)
        entry: devenv shell -- bun scripts/precommit.ts
        language: system
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]
      - id: hdt-fsharp-format
        name: F# formatting (versioned source and tests)
        entry: nix-shell avalonia/shell.nix --run "bash scripts/check-fsharp.sh"
        language: system
        files: '(\.(fs|fsi|fsx|fsproj)$|^avalonia/dotnet-tools\.json$|^\.editorconfig$|^scripts/check-fsharp\.sh$)'
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
